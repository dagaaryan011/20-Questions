<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20 Questions</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --accent: #58a6ff;
    --user: #21262d;
    --bot: #0d2818;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    color: var(--accent);
  }
  #reset-btn {
    background: var(--user);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 12px;
    cursor: pointer;
    font-family: inherit;
  }
  #reset-btn:hover { border-color: var(--accent); }
  #history {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user);
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot);
  }
  #input-bar {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 12px;
    gap: 8px;
  }
  #msg-input {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 10px;
    font-family: inherit;
    font-size: 14px;
  }
  #send-btn {
    background: var(--accent);
    color: #0d1117;
    border: none;
    padding: 10px 18px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
  }
  #send-btn:hover { opacity: 0.85; }
</style>
</head>
<body>
<header>
  <h1>20 Questions -- the book is Gulliver's Travels. Ask yes/no questions!</h1>
  <button id="reset-btn">Reset</button>
</header>
<div id="history"></div>
<div id="input-bar">
  <input id="msg-input" type="text" placeholder="Ask a yes/no question..." autocomplete="off">
  <button id="send-btn">Send</button>
</div>

<script>
const sessionId = crypto.randomUUID();
const historyEl = document.getElementById("history");
const inputEl = document.getElementById("msg-input");

function addMessage(text, role) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  historyEl.appendChild(div);
  historyEl.scrollTop = historyEl.scrollHeight;
}

async function send() {
  const message = inputEl.value.trim();
  if (!message) return;
  inputEl.value = "";
  addMessage(message, "user");

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, session_id: sessionId }),
    });
    const data = await res.json();
    addMessage(data.reply, "bot");
  } catch (err) {
    addMessage("Error: could not reach server.", "bot");
  }
}

document.getElementById("send-btn").addEventListener("click", send);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});

document.getElementById("reset-btn").addEventListener("click", async () => {
  await fetch("/reset", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId }),
  });
  historyEl.innerHTML = "";
});
</script>
</body>
</html>
